<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Especia Norte — Pedidos Mayoristas</title>
  <meta name="description" content="Descargá nuestro catálogo y hacé tu pedido mayorista de especias." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  
  <!-- Splash Screen -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-content">
      <img src="img/logoEspeciaNorte.png" alt="Especia Norte Logo" class="splash-logo" />
      <h1 class="splash-title">Especia Norte</h1>
      <p class="splash-subtitle">Sabor y Calidad Mayorista</p>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-top">
      <div class="logo-mini">
        <img src="img/logoEspeciaNorte.png" alt="Especia Norte Logo" />
      </div>
      <div class="brand-info">
        <h1>Especia Norte</h1>
        <span class="delivery-badge">🟢 Envío a domicilio y retiros</span>
      </div>
    </div>
    
    <!-- Prominent Catalog Download -->
    <a href="pdf/Catalogo260626.pdf" target="_blank" rel="noopener" class="catalog-banner btn-shimmer">
      <div class="catalog-banner-icon">📥</div>
      <div class="catalog-banner-text">
        <strong>Descargar Catálogo PDF</strong>
        <span>Lista de precios mayorista actualizada</span>
      </div>
    </a>
    
    <!-- Search Bar -->
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar especias, condimentos..." />
    </div>
  </header>

  <!-- Infinite Marquee / Banners -->
  <div class="marquee-container">
    <div class="marquee-track">
      <div class="marquee-item"><img src="img/especias.jfif" alt="Especias"></div>
      <div class="marquee-item"><img src="img/condimentos.jfif" alt="Condimentos"></div>
      <div class="marquee-item"><img src="img/aceitunas.webp" alt="Aceitunas"></div>
      <div class="marquee-item"><img src="img/mezclas.jfif" alt="Mezclas"></div>
      <div class="marquee-item"><img src="img/tripas.jfif" alt="Tripas"></div>
      <div class="marquee-item"><img src="img/dulcebatata.jpg" alt="Dulce de Batata"></div>
      <!-- Duplicate for seamless loop -->
      <div class="marquee-item"><img src="img/especias.jfif" alt="Especias"></div>
      <div class="marquee-item"><img src="img/condimentos.jfif" alt="Condimentos"></div>
      <div class="marquee-item"><img src="img/aceitunas.webp" alt="Aceitunas"></div>
      <div class="marquee-item"><img src="img/mezclas.jfif" alt="Mezclas"></div>
      <div class="marquee-item"><img src="img/tripas.jfif" alt="Tripas"></div>
      <div class="marquee-item"><img src="img/dulcebatata.jpg" alt="Dulce de Batata"></div>
    </div>
  </div>

  <main class="main-content">
    <h2 class="section-title">¿Qué estás buscando?</h2>
    
    <!-- Grid Categories (Bento Box style) -->
    <div class="categories-grid" id="categoriesGrid">
      <!-- Llenado por JS -->
    </div>

    <!-- Main Product List -->
    <div class="product-feed">
      <div id="productList" class="product-list">
        <!-- Llenado por JS -->
      </div>
    </div>
  </main>

  <!-- Bottom Floating Cart Button -->
  <div class="floating-cart" id="floatingCartBtn">
    <div class="cart-info">
      <span class="cart-qty-badge" id="floatingCartQty">0</span>
      <span class="cart-text">Ver pedido</span>
    </div>
    <span class="cart-total" id="floatingCartTotal">$ 0,00</span>
  </div>

  <!-- Checkout Modal (Bottom Sheet) -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Tu Pedido</h2>
        <button type="button" class="close-btn" id="closeModalBtn">✕</button>
      </div>
      
      <div class="modal-body">
        <ul id="cartList" class="cart-list">
          <!-- Llenado por JS -->
        </ul>
        
        <div class="cart-summary">
          <span>Total</span>
          <strong id="cartTotalValue">$ 0,00</strong>
        </div>
        
        <div class="checkout-form">
          <h3>Datos para el Envío</h3>
          <div class="form-group">
            <label for="inputName">Nombre completo</label>
            <input type="text" id="inputName" placeholder="Ej: Juan Pérez" />
          </div>
          <div class="form-group">
            <label for="inputAddress">Dirección de envío (Opcional si retira)</label>
            <input type="text" id="inputAddress" placeholder="Ej: San Martín 123, Tucumán" />
          </div>
          <div class="form-group">
            <label for="inputNotes">Notas / Aclaraciones</label>
            <textarea id="inputNotes" placeholder="Ej: Preferencia de horarios, dudas..."></textarea>
          </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn-whatsapp" id="btnWhatsApp">
          Enviar Pedido por WhatsApp
        </button>
        <button type="button" class="btn-clear" id="btnClearCart">Vaciar Carrito</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
